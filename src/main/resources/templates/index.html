<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        :root {
            --ink: #101720;
            --muted: #5b6673;
            --surface: #ffffff;
            --accent: #2f6bff;
            --accent-2: #ff7a59;
            --line: #e6e9ee;
            --shadow: 0 20px 60px rgba(16, 23, 32, 0.12);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            color: var(--ink);
            font-family: "Trebuchet MS", "Lucida Grande", "Lucida Sans Unicode", "Tahoma", sans-serif;
            background: radial-gradient(1200px 600px at 20% 10%, #ffe8d9 0%, transparent 55%),
                        radial-gradient(900px 500px at 90% 0%, #d9f0ff 0%, transparent 60%),
                        #f6f7fb;
            min-height: 100vh;
        }
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 20px 80px;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .title {
            font-size: clamp(28px, 3vw, 40px);
            margin: 0 0 8px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            margin: 0;
            color: var(--muted);
        }
        .primary-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), #2446d1);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 12px 30px rgba(47, 107, 255, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .primary-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(47, 107, 255, 0.45);
        }
        .card {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 28px;
            animation: fadeUp 0.6s ease both;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.1em;
            color: var(--muted);
        }
        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        tbody tr:hover {
            background: #f7f9ff;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #f0f3ff;
            color: #3f4da8;
            font-weight: 700;
            font-size: 12px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .button {
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid var(--line);
            color: var(--ink);
            background: #fff;
        }
        .button.edit {
            border-color: rgba(47, 107, 255, 0.3);
            color: #2446d1;
        }
        .button.delete {
            border-color: rgba(255, 122, 89, 0.4);
            color: #d6452d;
        }
        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 720px) {
            .actions {
                flex-direction: column;
                align-items: flex-start;
            }
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead {
                display: none;
            }
            tr {
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 12px;
                margin-bottom: 12px;
                background: #fff;
            }
            td {
                border-bottom: none;
                padding: 8px 0;
            }
            td::before {
                content: attr(data-label);
                display: block;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <header class="header">
        <div>
            <h1 class="title">Product Manager</h1>
            <p class="subtitle">Keep your inventory clean, current, and easy to browse.</p>
        </div>
        <a class="primary-action" href="new">+ Create new product</a>
    </header>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Brand</th>
                <th>Made in</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product:${listProducts}">
                <td data-label="Product">
                    <span class="badge" th:text="${product.id}">ID</span>
                    <div th:text="${product.name}">Name</div>
                </td>
                <td data-label="Brand" th:text="${product.brand}">Brand</td>
                <td data-label="Made in" th:text="${product.madein}">Made in</td>
                <td data-label="Price" th:text="${product.price}">Price</td>
                <td data-label="Actions">
                    <div class="actions">
                        <a class="button edit" th:href="@{'/edit/'+${product.id}}">Edit</a>
                        <a class="button delete" th:href="@{'/delete/'+${product.id}}">Delete</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listProducts)}">
                <td class="empty-state" colspan="5">No products yet. Create one to get started.</td>
            </tr>
            </tbody>
        </table>
    </section>
</div>

</body>
</html>
